# Central dependency declarations for every module.
# Versions were resolved from Maven Central and the Gradle Plugin Portal on 2026-09-24.
[versions]
kotlin = "2.4.20"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
ktor = "3.6.0"
ktlint-plugin = "14.2.0"
jena = "6.2.0"
corenlp = "4.5.10"
djl = "0.38.0"
pdfbox = "3.0.8"
poi = "5.5.1"
jgrapht = "1.5.3"
jgraphx = "4.2.2"
logback = "1.6.4"
dotenv = "6.5.1"
kotlin-wrappers = "2026.9.2"
junit = "6.1.3"
koog = "1.3.0"

[libraries]
# Kotlin
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Ktor server (api.py replacement)
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# LLM access, prompts, structured output, embeddings (Koog)
koog-agents = { module = "ai.koog:koog-agents", version.ref = "koog" }
koog-agents-test = { module = "ai.koog:agents-test", version.ref = "koog" }

# RDF (rdflib replacement): SPARQL engine and the TDB2 persistent triple store
jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "jena" }
jena-tdb2 = { module = "org.apache.jena:jena-tdb2", version.ref = "jena" }

# NLP (spaCy replacement: NER, sentence splitting, dependency parsing)
corenlp = { module = "edu.stanford.nlp:stanford-corenlp", version.ref = "corenlp" }
corenlp-models = { module = "edu.stanford.nlp:stanford-corenlp", version.ref = "corenlp" }

# Embeddings (sentence-transformers replacement)
djl-api = { module = "ai.djl:api", version.ref = "djl" }
djl-pytorch-engine = { module = "ai.djl.pytorch:pytorch-engine", version.ref = "djl" }
djl-pytorch-model-zoo = { module = "ai.djl.pytorch:pytorch-model-zoo", version.ref = "djl" }
djl-huggingface-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djl" }

# Documents (PyPDF2 / python-docx replacement)
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }

# Visualization (networkx / matplotlib replacement)
jgrapht-core = { module = "org.jgrapht:jgrapht-core", version.ref = "jgrapht" }
jgrapht-ext = { module = "org.jgrapht:jgrapht-ext", version.ref = "jgrapht" }
jgraphx = { module = "com.github.vlsi.mxgraph:jgraphx", version.ref = "jgraphx" }

# Infrastructure
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
dotenv-kotlin = { module = "io.github.cdimascio:dotenv-kotlin", version.ref = "dotenv" }

# Tests
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }

# Kotlin/JS wrappers (React, router, query, browser APIs)
kotlin-wrappers-bom = { module = "org.jetbrains.kotlin-wrappers:kotlin-wrappers-bom", version.ref = "kotlin-wrappers" }
kotlin-react = { module = "org.jetbrains.kotlin-wrappers:kotlin-react" }
kotlin-react-dom = { module = "org.jetbrains.kotlin-wrappers:kotlin-react-dom" }
kotlin-tanstack-react-router = { module = "org.jetbrains.kotlin-wrappers:kotlin-tanstack-react-router" }
kotlin-tanstack-react-query = { module = "org.jetbrains.kotlin-wrappers:kotlin-tanstack-react-query" }
kotlin-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser" }

[bundles]
ktor-server = [
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-content-negotiation",
    "ktor-server-cors",
    "ktor-server-status-pages",
    "ktor-server-call-logging",
    "ktor-serialization-kotlinx-json",
]
koog = ["koog-agents"]
djl = [
    "djl-api",
    "djl-pytorch-engine",
    "djl-pytorch-model-zoo",
    "djl-huggingface-tokenizers",
]
visualization = ["jgrapht-core", "jgrapht-ext", "jgraphx"]
react = ["kotlin-react", "kotlin-react-dom", "kotlin-tanstack-react-router", "kotlin-tanstack-react-query", "kotlin-browser"]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
